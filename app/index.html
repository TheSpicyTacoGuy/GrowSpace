    <script>
      (function() {
        // Theme utility functions
        function getThemeCookie() {
          var match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
          return match ? decodeURIComponent(match[1]) : null;
        }
        
        function getSystemTheme() {
          return window.matchMedia && 
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        
        function getPreferredTheme() {
          var theme = getThemeCookie() || localStorage.getItem("theme") || "system";
          return theme === "system" ? getSystemTheme() : theme;
        }
        
        function applyTheme(theme) {
          var html = document.documentElement;
          html.removeAttribute("data-bs-theme");
          
          if (theme === "dark" || theme === "light") {
            html.setAttribute("data-bs-theme", theme);
          }
          
          // Update theme color meta tag
          var meta = document.getElementById('theme-color');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#2a2c2e' : '#f8f9fa');
          }
        }
        
        // Initial theme application
        applyTheme(getPreferredTheme());
        
        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          var currentTheme = getThemeCookie() || localStorage.getItem("theme") || "system";
          if (currentTheme === "system") {
            applyTheme(getSystemTheme());
          }
        });
        
        // Ensure theme is applied after DOM is fully loaded
        document.addEventListener('DOMContentLoaded', function() {
          applyTheme(getPreferredTheme());
        });
      })();
    </script>
